const F={};
function dec(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:'text/html;charset=utf-8'}))}
function show(k){if(!DATA[k])k='level8';
 if(!F[k]){const f=document.createElement('iframe');f.src=dec(DATA[k]);f.title=k;document.getElementById('frames').appendChild(f);F[k]=f}
 for(const x in F)F[x].classList.toggle('on',x===k);
 document.getElementById('game').value=k;
 history.replaceState(null,'','#'+k);F[k].focus()}
document.getElementById('game').onchange=e=>show(e.target.value);
show(location.hash.slice(1));
</script></body></html>
